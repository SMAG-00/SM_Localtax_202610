# 배포 후 점검 (FND-02) — main에 올리면 Vercel Production 배포가 반영될 때까지 기다렸다가 운영 주소의 상태 확인을 본다.
# 실패하면(예: 운영 배포가 시험 DB를 가리킴, 배포 실패) 이 작업이 실패하고 GitHub이 저장소 소유자에게 알린다.
# Vercel의 배포 알림(deployment_status)에 기대지 않는다 — 상태 확인의 version(커밋 앞 7자리)으로 반영을 확인한다.
name: Post-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-deploy
  cancel-in-progress: true

jobs:
  health:
    name: 배포 후 상태 확인
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: 상태 확인
        run: |
          url=$(node -p 'require("./apps/web/config/environments.json").productionUrl')
          bash scripts/ci/post-deploy.sh "$url" "${GITHUB_SHA::7}"
